# ----------------------------------------
# 4. Dependency Security Scan
# ----------------------------------------
dependency_check:
    stage: scan
    image: eclipse-temurin:21-jdk
    needs:
        - job: backend_build
          artifacts: false
    script:
        - cd backend
        - chmod +x gradlew
        - ./gradlew dependencyCheckAnalyze
          -Dorg.owasp.dependencycheck.data.directory=$CI_PROJECT_DIR/backend/dependency-check-data
          --stacktrace
    artifacts:
        paths:
            - backend/build/reports/dependency-check-report.html
        when: always
    cache:
        - key: NVD-db-cache-v4
          paths:
              - backend/dependency-check-data/
    allow_failure: true

# ----------------------------------------
# 5. Unified SonarQube Analysis
# ----------------------------------------
sonarQube:
    stage: analyze
    image: sonarsource/sonar-scanner-cli:latest
    needs:
        - job: backend_build
          artifacts: true
        - job: frontend_build
          artifacts: false
        - job: backend_test
          artifacts: true
    script:
        - sonar-scanner
          -Dsonar.projectKey=$SONAR_PROJECT
          -Dsonar.projectName=$SONAR_PROJECT
          -Dsonar.host.url=$SONAR_URL
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.sources=backend/src/main,frontend
          -Dsonar.java.binaries=backend/build/classes/java/main/
          -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**
          -Dsonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
