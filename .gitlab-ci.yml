stages:
    - deploy

# ----------------------------------------
# Deploy Backend to Render
# ----------------------------------------
deploy_backend:
    stage: deploy
    image:
        name: gcr.io/kaniko-project/executor:v1.23.2-debug
        entrypoint: [""]
    script:
        # 1. Authenticate with Docker Hub
        - mkdir -p /kaniko/.docker
        - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n $DOCKER_HUB_USERNAME:$DOCKER_HUB_ACCESS_TOKEN | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
        # 2. Build and push to Docker Hub
        - /kaniko/executor
          --context $CI_PROJECT_DIR/backend
          --dockerfile $CI_PROJECT_DIR/backend/Dockerfile
          --destination $DOCKER_HUB_USERNAME/studyspace-backend:latest
          --destination $DOCKER_HUB_USERNAME/studyspace-backend:$CI_COMMIT_SHA
        # 3. Trigger Render deploy hook
        - wget -q -O /dev/null --post-data="" $RENDER_DEPLOY_HOOK_URL
