stages:
    - build
    - test
    - scan
    - analyze

# ----------------------------------------
# 1. Backend Compile
# ----------------------------------------
backend_build:
    stage: build
    image: eclipse-temurin:21-jdk
    script:
        - cd backend
        - chmod +x gradlew
        - ./gradlew classes
    artifacts:
        paths:
            - backend/build/classes/java/main/

# ----------------------------------------
# 2. Frontend Build
# ----------------------------------------
frontend_build:
    stage: build
    image: node:20-alpine
    script:
        - cd frontend
        - npm ci
        - npm run build
    artifacts:
        paths:
            - ./frontend/.next/

# ----------------------------------------
# 3. Backend Test + Coverage
# ----------------------------------------
backend_test:
    stage: test
    image: eclipse-temurin:21-jdk
    needs:
        - job: backend_build
          artifacts: true
    script:
        - cd backend
        - chmod +x gradlew
        - ./gradlew test
        - ./gradlew jacocoTestReport
    artifacts:
        paths:
            - backend/build/reports/jacoco/test/jacocoTestReport.xml
        when: always

