stages:
    - build
    - test
    - analyze

# ----------------------------------------
# 1. Build Stages (Generates Binaries)
# ----------------------------------------
backend_build:
    stage: build
    image: eclipse-temurin:17-jdk
    script:
        - cd backend
        - chmod +x gradlew
        # Compiles code and runs dependency check (from previous step)
        - ./gradlew clean classes dependencyCheckAggregate
    artifacts:
        paths:
            # CRITICAL: SonarScanner needs these compiled classes
            - ./backend/build/classes/java/main/
            - ./backend/build/reports/dependency-check-report.html # Optional: save DC report
    cache:
        - key: NVD-db-cache
          paths:
              - ./backend/dependency-check-data/

# ----------------------------------------
# 2. Test Stages (Generates Coverage)
# ----------------------------------------
backend_test:
    stage: test
    image: eclipse-temurin:17-jdk
    dependencies:
        - backend_build
    script:
        - cd backend
        - chmod +x gradlew
        - ./gradlew test
        - ./gradlew jacocoTestReport # Generates the XML coverage report
    artifacts:
        paths:
            # CRITICAL: SonarScanner needs this XML for coverage stats
            - ./backend/build/reports/jacoco/test/jacocoTestReport.xml
frontend_build:
    stage: build
    image: node:18-alpine # Use the Node version your Next.js app requires
    script:
        - cd frontend
        - npm ci # Strictly installs exact dependencies from package-lock.json
        - npm run build # Builds the Next.js app
    artifacts:
        paths:
            - ./frontend/.next/
            - ./frontend/node_modules/ # Pass node_modules so Sonar can analyze TS types accurately

# ----------------------------------------
# Frontend Test Stage (Optional but Recommended)
# ----------------------------------------
frontend_test:
    stage: test
    image: node:18-alpine
    dependencies:
        - frontend_build
    script:
        - cd frontend
        # Assuming you have a test script in package.json like: "test:coverage": "jest --coverage"
        - npm run test:coverage
    artifacts:
        paths:
            # SonarQube looks for this specific file format for JavaScript/TypeScript coverage
            - ./frontend/coverage/lcov.info

# ----------------------------------------
# 3. Unified SonarQube Analysis
# ----------------------------------------
sonarQube:
    stage: analyze
    image: sonarsource/sonar-scanner-cli:latest
    dependencies:
        - backend_build
        - backend_test
    script:
        # Notice we run one scanner command for both backend and frontend
        # Note: Modern Sonar prefers 'sonar.token' over 'sonar.login'
        - sonar-scanner \
          -Dsonar.projectKey=$SONAR_PROJECT \
          -Dsonar.projectName=$SONAR_PROJECT \
          -Dsonar.host.url=$SONAR_URL \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.sources=./backend/src/main,./frontend/src \
          -Dsonar.java.binaries=./backend/build/classes/java/main/ \
          -Dsonar.coverage.jacoco.xmlReportPaths=./backend/build/reports/jacoco/test/jacocoTestReport.xml \
          -Dsonar.tests=./backend/src/test/ \
          -Dsonar.verbose=true
