# Docker Profile Configuration
spring.application.name=StudySpace

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studyspace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studyspace}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studyspace123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL Initialization 
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgres.sql

logging.level.org.hibernate=ERROR

# CORS Configuration (adjust for production)
spring.web.cors.allowed-origins=http://localhost:3000,http://frontend:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Frontend callback URL for OAuth2 redirect
app.frontend.callback-url=${FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}

# OAuth2 Configuration
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,address,phone

# GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

gemini.api.key=${GEMINI_API_KEY}
openai.api.key=${OPENAI_API_KEY:}

# Tigris / AWS S3 Configuration
app.s3.bucket-name=${S3_BUCKET_NAME:study-space-bucket}
app.s3.endpoint-url=${AWS_ENDPOINT_URL_S3:https://fly.storage.tigris.dev}
app.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
