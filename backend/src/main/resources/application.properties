spring.application.name=StudySpace
spring.profiles.active=local

# File Upload Configuration
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# ── Local PostgreSQL (replaces the H2 in-memory DB used during early development) ──
spring.datasource.url=jdbc:postgresql://localhost:5432/studyspace
spring.datasource.username=studyspace
spring.datasource.password=${DB_PASSWORD:local_studyspace_pw}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=none

# ── Schema init: runs schema.sql on every startup (IF NOT EXISTS guards make it idempotent) ──
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.sql.init.data-locations=classpath:local-data.sql

logging.level.org.hibernate=ERROR
logging.level.com.studyspace=INFO

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Frontend callback URL for OAuth2 redirect (override via env var in production)
app.frontend.callback-url=${FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}

# OAuth2 Configuration
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,address,phone

# GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

logging.level.me.paulschwarz.springdotenv=DEBUG

gemini.api.key=${GEMINI_API_KEY}
openai.api.key=${OPENAI_API_KEY:}